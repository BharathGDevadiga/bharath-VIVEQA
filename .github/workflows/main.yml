name: Sentinel-RV Verilog & Python CI Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verilog-compile-test:
    name: Compile & Test Verilog (Icarus)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run All Testbenches
        shell: pwsh
        working-directory: ./Sentinel_RV_Capstone_Project/Codes/Verilog/src
        run: |
          # Uses your existing PowerShell test script
          ./tb/run_tests.ps1

  python-syntax-check:
    name: Check Python Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyserial matplotlib
          
      - name: Compile Python Scripts
        working-directory: ./Sentinel_RV_Capstone_Project/Codes/Python
        run: |
          python -m py_compile App1_FPGA_Control_And_Sensors.py
          python -m py_compile App2_SD_Card_Reader.py
